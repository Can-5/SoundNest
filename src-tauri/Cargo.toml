[package]
name = "soundnest"
version = "0.1.0"
edition = "2021"
description = "Ambient sound mixer with profiles, sleep timer and fade"
license = "MIT"

[lib]
name = "soundnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
